name: Audit published benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen artifacts
        run: python3 scripts/verify_manifest.py
      - name: Audit result completeness and counts
        run: python3 scripts/audit_results.py results/raw-results.jsonl --expect-published
      - name: Regenerate summaries
        run: |
          python3 summarize.py
          git diff --exit-code -- results/summary.csv results/category-summary.csv results/report.md
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile deal_v12_eval.py run_benchmark.py summarize.py benchmark_validator.py scripts/*.py
          bash -n scripts/*.sh
